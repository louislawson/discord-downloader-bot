services:
  bot:
    image: louislawson/downloader-bot:latest-arm64-v8
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "discordhealthcheck" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: louislawson/downloader-bot:latest-arm64-v8
    env_file:
      - .env
    command: [ "python", "-m", "taskiq", "worker", "downloader_bot.tq:broker", "downloader_bot.tasks" ]
    environment:
      - TASKIQ_PROCESS_ROLE=worker
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-m", "downloader_bot.worker.healthcheck" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    image: louislawson/downloader-bot:latest-arm64-v8
    env_file:
      - .env
    command: [ "python", "-m", "taskiq", "scheduler", "downloader_bot.tq:scheduler", "downloader_bot.tasks" ]
    environment:
      - TASKIQ_PROCESS_ROLE=scheduler
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-m", "downloader_bot.worker.healthcheck" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.3.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    healthcheck:
      # use the flag --erlang-cookie if setting the erlang
      # cookie was necessary (comment by red-riding-hood)
      # test: rabbitmq-diagnostics -q ping --erlang-cookie "mycookie"
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 1s
      retries: 30

volumes:
  redis-data:
  postgres-data:
  rabbitmq_data:
  rabbitmq_log:
